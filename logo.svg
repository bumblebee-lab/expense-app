<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Expense Management">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#12266B"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="122" fill="url(#tile)"/>
  <circle cx="452" cy="72" r="150" fill="#fff" opacity="0.06"/>

  <!-- document -->
  <path d="M150 96h150l62 62v186H150z" fill="#FFFFFF"/>
  <path d="M300 96l62 62h-62z" fill="#CBD9F5"/>
  <g stroke="#1E3A8A" stroke-width="17" stroke-linecap="round">
    <path d="M192 178h74"/><path d="M192 224h128"/>
  </g>
  <g stroke="#10B981" stroke-width="17" stroke-linecap="round">
    <path d="M192 270h100"/>
  </g>

  <!-- wallet pocket in front -->
  <path d="M112 268h288a34 34 0 0 1 34 34v76a34 34 0 0 1-34 34H112a34 34 0 0 1-34-34v-76a34 34 0 0 1 34-34Z"
        fill="url(#pocket)"/>
  <path d="M78 302h356v22H78z" fill="#0F2A6B" opacity="0.28"/>

  <!-- approval tick -->
  <g transform="translate(300 300)">
    <circle cx="66" cy="66" r="70" fill="#FFFFFF"/>
    <circle cx="66" cy="66" r="58" fill="url(#tick)"/>
    <path d="M40 67l18 18 34-38" stroke="#fff" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
