<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Expense Management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.55" stop-color="#12336B"/>
      <stop offset="1" stop-color="#0A1C3C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- receipt slipping out of the wallet -->
  <g transform="translate(150 92)">
    <path d="M0 8a8 8 0 0 1 8-8h150a8 8 0 0 1 8 8v190l-27-16-26 16-27-16-26 16-27-16-25 16-8-5Z"
          fill="url(#paper)"/>
    <g stroke="#94A7C9" stroke-width="11" stroke-linecap="round">
      <path d="M30 52h104"/>
      <path d="M30 92h104"/>
      <path d="M30 132h60"/>
    </g>
  </g>

  <!-- wallet body -->
  <g>
    <rect x="82" y="212" width="348" height="220" rx="46" fill="#0B2247"/>
    <rect x="82" y="212" width="348" height="220" rx="46" fill="none" stroke="#2F5AA8" stroke-width="6"/>
    <!-- flap -->
    <path d="M82 268h348v34a26 26 0 0 1-26 26H108a26 26 0 0 1-26-26Z" fill="#153E86" opacity="0.55"/>
    <!-- card slot / clasp -->
    <rect x="286" y="292" width="168" height="82" rx="26" fill="#0F7B4F"/>
    <rect x="286" y="292" width="168" height="82" rx="26" fill="none" stroke="#16A34A" stroke-width="6"/>
    <circle cx="342" cy="333" r="19" fill="#4ADE80"/>
  </g>
</svg>
